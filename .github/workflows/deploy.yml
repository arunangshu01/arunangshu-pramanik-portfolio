name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE: portfolio-api
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy to Google Cloud
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deployment variables
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          for name in PROJECT_ID GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions variable $name; see README.md GCP setup."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Reject stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          test "$COMMIT" = "$HEAD_SHA" || { echo 'Refusing to deploy an outdated main commit.'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests -v
      - name: Verify and build frontend
        working-directory: frontend
        env:
          CI: true
          REACT_APP_API_BASE: /arunangshu_pramanik/portfolio/v1
        run: |
          npm ci
          npm test -- --watchAll=false
          npm run build
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push API image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/portfolio/api:${COMMIT}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Recheck main before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          test "$COMMIT" = "$HEAD_SHA" || { echo 'Main changed during build; wait for the newer deployment.'; exit 1; }
      - name: Deploy API
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "portfolio-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --ingress all \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 40 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 60 \
            --env-vars-file deploy/cloud-run.env.yaml \
            --set-secrets 'BREVO_API_KEY=portfolio-brevo-api-key:latest,MAIL_FROM=portfolio-mail-from:latest,RECEIVER_EMAIL=portfolio-receiver-email:latest,ANALYTICS_ADMIN_TOKEN=portfolio-analytics-admin-token:latest' \
            --quiet
      - name: Check API health
        run: |
          API_ORIGIN=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 60 "$API_ORIGIN/arunangshu_pramanik/portfolio/v1/health"
      - name: Deploy frontend
        run: firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
      - name: Smoke test Hosting and API rewrite
        run: |
          SITE=$(node -p "require('./firebase.json').hosting.site")
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 60 "https://${SITE}.web.app/" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 60 "https://${SITE}.web.app/arunangshu_pramanik/portfolio/v1/health"
